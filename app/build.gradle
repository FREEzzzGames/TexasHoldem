plugins {
    id 'com.android.application'
}

android {
    namespace 'com.d3tr01t.texasholdem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.d3tr01t.texasholdem'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}