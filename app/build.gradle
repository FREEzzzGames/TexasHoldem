plugins {
    id 'com.android.application'
}

android {
    namespace 'com.d3tr01t.texasholdem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.d3tr01t.texasholdem.rebuilt'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
